name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14            # arm64 runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build gppcc.app
        run: ./build_macos.sh

      - name: Check architecture
        run: |
          file dist/gppcc.app/Contents/MacOS/gppcc
          file dist/gppcc.app/Contents/MacOS/gppcc | grep -q arm64

      - name: Zip app
        # ditto keeps the bundle's symlinks and code signature intact.
        run: ditto -c -k --keepParent dist/gppcc.app dist/gppcc-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gppcc-macos-arm64
          path: dist/gppcc-macos-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows 11 (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Build gppcc.exe
        shell: pwsh
        run: ./build_windows.ps1

      - name: Zip exe
        shell: pwsh
        run: Compress-Archive -Path dist/gppcc.exe -DestinationPath dist/gppcc-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gppcc-windows-x64
          path: dist/gppcc-windows-x64.zip
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
